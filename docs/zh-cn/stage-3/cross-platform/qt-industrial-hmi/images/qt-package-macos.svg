<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <rect width="1280" height="560" rx="28" fill="#f5f8fa"/>
  <text x="64" y="70" fill="#192630" font-size="32" font-family="Arial, sans-serif" font-weight="700">macOS：生成可独立运行的 App 和 DMG</text>
  <g font-family="Arial, sans-serif">
    <rect x="64" y="136" width="250" height="260" rx="20" fill="#fff" stroke="#d7e0e7"/><circle cx="189" cy="202" r="30" fill="#e4f7ef"/><text x="189" y="211" text-anchor="middle" fill="#16805f" font-size="28">1</text><text x="189" y="268" text-anchor="middle" fill="#25333e" font-size="21" font-weight="700">Release 构建</text><text x="189" y="307" text-anchor="middle" fill="#6e7f8d" font-size="16">得到 MyApp.app</text><text x="189" y="337" text-anchor="middle" fill="#6e7f8d" font-size="16">先直接启动一次</text>
    <path d="M330 266h56" stroke="#71899a" stroke-width="4"/><path d="m386 266-14-10v20z" fill="#71899a"/>
    <rect x="402" y="136" width="300" height="260" rx="20" fill="#fff" stroke="#d7e0e7"/><circle cx="552" cy="202" r="30" fill="#e4f7ef"/><text x="552" y="211" text-anchor="middle" fill="#16805f" font-size="28">2</text><text x="552" y="268" text-anchor="middle" fill="#25333e" font-size="21" font-weight="700">运行 macdeployqt</text><text x="552" y="307" text-anchor="middle" fill="#6e7f8d" font-size="16">带上 -qmldir</text><text x="552" y="337" text-anchor="middle" fill="#6e7f8d" font-size="16">需要时加 -dmg</text>
    <path d="M718 266h56" stroke="#71899a" stroke-width="4"/><path d="m774 266-14-10v20z" fill="#71899a"/>
    <rect x="790" y="136" width="426" height="260" rx="20" fill="#fff" stroke="#d7e0e7"/><circle cx="1003" cy="202" r="30" fill="#e4f7ef"/><text x="1003" y="211" text-anchor="middle" fill="#16805f" font-size="28">3</text><text x="1003" y="268" text-anchor="middle" fill="#25333e" font-size="21" font-weight="700">在另一台 Mac 验证</text><text x="1003" y="307" text-anchor="middle" fill="#6e7f8d" font-size="16">打开 DMG · 拖入 Applications</text><text x="1003" y="337" text-anchor="middle" fill="#6e7f8d" font-size="16">启动、写入记录、重启再查询</text>
  </g>
  <rect x="64" y="444" width="1152" height="58" rx="15" fill="#fff3d9"/><text x="640" y="480" text-anchor="middle" fill="#8a5a00" font-size="18" font-family="Arial, sans-serif" font-weight="700">准备公开分发时，还要完成 Apple 代码签名和公证；DMG 能生成不等于可以直接上线</text>
</svg>
