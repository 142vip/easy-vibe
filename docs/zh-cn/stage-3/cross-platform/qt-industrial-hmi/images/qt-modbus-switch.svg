<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
  <rect width="1280" height="520" rx="28" fill="#f5f8fa"/>
  <text x="64" y="70" fill="#192630" font-size="32" font-family="Arial, sans-serif" font-weight="700">界面不变，只替换数据来源</text>
  <g font-family="Arial, sans-serif">
    <rect x="64" y="138" width="300" height="244" rx="20" fill="#fff" stroke="#d7e0e7"/><text x="214" y="184" text-anchor="middle" fill="#26343f" font-size="22" font-weight="700">开发时</text><rect x="102" y="220" width="224" height="76" rx="14" fill="#dcf8ec"/><text x="214" y="252" text-anchor="middle" fill="#118360" font-size="18" font-weight="700">模拟数据源</text><text x="214" y="278" text-anchor="middle" fill="#4b6b61" font-size="15">不依赖设备</text><text x="214" y="338" text-anchor="middle" fill="#6b7984" font-size="16">localhost · 自动变化</text>
    <rect x="490" y="138" width="300" height="244" rx="20" fill="#fff" stroke="#d7e0e7"/><text x="640" y="184" text-anchor="middle" fill="#26343f" font-size="22" font-weight="700">数据适配层</text><rect x="528" y="220" width="224" height="76" rx="14" fill="#e9f1ff"/><text x="640" y="252" text-anchor="middle" fill="#2762b3" font-size="18" font-weight="700">统一指标模型</text><text x="640" y="278" text-anchor="middle" fill="#55708d" font-size="15">pressure / temp / vibration</text><text x="640" y="338" text-anchor="middle" fill="#6b7984" font-size="16">页面只读取这一层</text>
    <rect x="916" y="138" width="300" height="244" rx="20" fill="#fff" stroke="#d7e0e7"/><text x="1066" y="184" text-anchor="middle" fill="#26343f" font-size="22" font-weight="700">接设备时</text><rect x="954" y="220" width="224" height="76" rx="14" fill="#fff0d6"/><text x="1066" y="252" text-anchor="middle" fill="#a86600" font-size="18" font-weight="700">Modbus TCP</text><text x="1066" y="278" text-anchor="middle" fill="#7b6544" font-size="15">127.0.0.1 : 50200</text><text x="1066" y="338" text-anchor="middle" fill="#6b7984" font-size="16">先连官方 Server 示例</text>
    <path d="M380 260h94" stroke="#698295" stroke-width="4"/><path d="m474 260-14-10v20z" fill="#698295"/><path d="M806 260h94" stroke="#698295" stroke-width="4"/><path d="m900 260-14-10v20z" fill="#698295"/>
  </g>
  <rect x="64" y="420" width="1152" height="52" rx="14" fill="#e5f5ef"/><text x="640" y="453" text-anchor="middle" fill="#176f55" font-size="18" font-family="Arial, sans-serif" font-weight="700">验证：切换数据源后，页面布局、报警规则和 SQLite 记录都不需要重写</text>
</svg>
