<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
  <rect width="1280" height="600" rx="28" fill="#07131f"/>
  <text x="64" y="70" fill="#eef7ff" font-size="32" font-family="Arial, sans-serif" font-weight="700">Windows：先做 Release，再收集依赖</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(64 140)"><rect width="250" height="280" rx="20" fill="#102433" stroke="#2f5165"/><circle cx="125" cy="66" r="30" fill="#143f38"/><text x="125" y="75" text-anchor="middle" fill="#55e6ad" font-size="28">1</text><text x="125" y="132" text-anchor="middle" fill="#eef7ff" font-size="21" font-weight="700">选择 Release</text><text x="125" y="173" text-anchor="middle" fill="#91a8b9" font-size="16">Qt Creator 左下角</text><text x="125" y="199" text-anchor="middle" fill="#91a8b9" font-size="16">切换构建配置</text><rect x="43" y="229" width="164" height="34" rx="9" fill="#163e36"/><text x="125" y="252" text-anchor="middle" fill="#55e6ad" font-size="15">Build Success</text></g>
    <path d="M330 280h52" stroke="#4d7489" stroke-width="4"/><path d="m382 280-13-9v18z" fill="#4d7489"/>
    <g transform="translate(398 140)"><rect width="250" height="280" rx="20" fill="#102433" stroke="#2f5165"/><circle cx="125" cy="66" r="30" fill="#143f38"/><text x="125" y="75" text-anchor="middle" fill="#55e6ad" font-size="28">2</text><text x="125" y="132" text-anchor="middle" fill="#eef7ff" font-size="21" font-weight="700">运行 windeployqt</text><text x="125" y="173" text-anchor="middle" fill="#91a8b9" font-size="16">在 Qt 命令行环境</text><text x="125" y="199" text-anchor="middle" fill="#91a8b9" font-size="16">对 exe 收集依赖</text><rect x="28" y="229" width="194" height="34" rx="9" fill="#0b1b27"/><text x="125" y="252" text-anchor="middle" fill="#77c7ff" font-size="14">--dry-run 先检查</text></g>
    <path d="M664 280h52" stroke="#4d7489" stroke-width="4"/><path d="m716 280-13-9v18z" fill="#4d7489"/>
    <g transform="translate(732 140)"><rect width="250" height="280" rx="20" fill="#102433" stroke="#2f5165"/><circle cx="125" cy="66" r="30" fill="#143f38"/><text x="125" y="75" text-anchor="middle" fill="#55e6ad" font-size="28">3</text><text x="125" y="132" text-anchor="middle" fill="#eef7ff" font-size="21" font-weight="700">检查关键目录</text><text x="125" y="173" text-anchor="middle" fill="#91a8b9" font-size="16">platforms / qml</text><text x="125" y="199" text-anchor="middle" fill="#91a8b9" font-size="16">sqldrivers / Qt DLL</text><rect x="43" y="229" width="164" height="34" rx="9" fill="#163e36"/><text x="125" y="252" text-anchor="middle" fill="#55e6ad" font-size="15">目录完整</text></g>
    <path d="M998 280h52" stroke="#4d7489" stroke-width="4"/><path d="m1050 280-13-9v18z" fill="#4d7489"/>
    <g transform="translate(1066 140)"><rect width="150" height="280" rx="20" fill="#102433" stroke="#2f5165"/><circle cx="75" cy="66" r="30" fill="#143f38"/><text x="75" y="75" text-anchor="middle" fill="#55e6ad" font-size="28">4</text><text x="75" y="132" text-anchor="middle" fill="#eef7ff" font-size="19" font-weight="700">换机测试</text><text x="75" y="173" text-anchor="middle" fill="#91a8b9" font-size="15">没有 Qt 的</text><text x="75" y="197" text-anchor="middle" fill="#91a8b9" font-size="15">干净电脑</text><rect x="23" y="229" width="104" height="34" rx="9" fill="#163e36"/><text x="75" y="252" text-anchor="middle" fill="#55e6ad" font-size="14">可启动</text></g>
  </g>
  <text x="64" y="500" fill="#9db2c1" font-size="18" font-family="Arial, sans-serif">文件夹能独立运行后，再用 Qt Installer Framework 制作安装程序。</text>
  <text x="64" y="536" fill="#f6ca65" font-size="18" font-family="Arial, sans-serif">不要只在开发电脑上双击成功就算打包完成。</text>
</svg>
