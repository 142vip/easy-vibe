<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <rect width="1280" height="620" rx="28" fill="#07131f"/>
  <text x="64" y="70" fill="#eef7ff" font-size="32" font-family="Arial, sans-serif" font-weight="700">先用模拟数据把界面跑通</text>
  <text x="64" y="108" fill="#8ca4b8" font-size="18" font-family="Arial, sans-serif">没有设备也能完成第一轮开发；以后只替换数据来源</text>
  <g font-family="Arial, sans-serif">
    <rect x="64" y="150" width="330" height="368" rx="20" fill="#102433" stroke="#2f5165"/><text x="94" y="190" fill="#dbe9f2" font-size="20" font-weight="700">模拟器</text><circle cx="98" cy="240" r="8" fill="#55e6ad"/><text x="122" y="247" fill="#9db2c1" font-size="17">每 1 秒刷新一次</text><text x="94" y="303" fill="#7f96a7" font-size="15">PRESSURE</text><text x="94" y="344" fill="#55e6ad" font-size="34" font-weight="700">1.34 MPa</text><text x="94" y="399" fill="#7f96a7" font-size="15">TEMPERATURE</text><text x="94" y="440" fill="#62b9ff" font-size="34" font-weight="700">71.8 °C</text><rect x="94" y="470" width="174" height="35" rx="10" fill="#153c35"/><text x="181" y="493" text-anchor="middle" fill="#55e6ad" font-size="15" font-weight="700">SIMULATION ON</text>
    <path d="M424 334h102" stroke="#5e8297" stroke-width="5"/><path d="m526 334-16-11v22z" fill="#5e8297"/><text x="475" y="312" text-anchor="middle" fill="#8299a9" font-size="15">同一数据模型</text>
    <rect x="556" y="150" width="660" height="368" rx="20" fill="#102433" stroke="#2f5165"/><text x="586" y="190" fill="#dbe9f2" font-size="20" font-weight="700">Qt 客户端</text><rect x="586" y="222" width="180" height="106" rx="14" fill="#0b1b27"/><text x="606" y="250" fill="#7690a3" font-size="13">压力</text><text x="606" y="293" fill="#55e6ad" font-size="30" font-weight="700">1.34</text><rect x="784" y="222" width="180" height="106" rx="14" fill="#0b1b27"/><text x="804" y="250" fill="#7690a3" font-size="13">温度</text><text x="804" y="293" fill="#62b9ff" font-size="30" font-weight="700">71.8</text><rect x="982" y="222" width="204" height="106" rx="14" fill="#0b1b27"/><text x="1002" y="250" fill="#7690a3" font-size="13">连接状态</text><text x="1002" y="293" fill="#55e6ad" font-size="23" font-weight="700">模拟运行中</text>
    <polyline points="586,453 648,420 710,437 772,374 834,399 896,345 958,384 1020,322 1082,350 1186,292" fill="none" stroke="#55e6ad" stroke-width="4"/><line x1="586" y1="470" x2="1186" y2="470" stroke="#2e4656"/><text x="586" y="494" fill="#718a9b" font-size="14">最近 30 秒</text>
  </g>
  <text x="64" y="575" fill="#9db2c1" font-size="18" font-family="Arial, sans-serif">验证：数字持续变化、曲线向左滚动、停止模拟后界面不再刷新。</text>
</svg>
