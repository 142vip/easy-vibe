<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Easy Vibe learning map</title>
  <desc id="desc">A three-stage learning journey from idea validation and prototyping, through full-stack product delivery, to advanced AI coding and cross-platform development.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.5" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
    <linearGradient id="stage1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18b981"/>
      <stop offset="1" stop-color="#0e9278"/>
    </linearGradient>
    <linearGradient id="stage2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c63ff"/>
      <stop offset="1" stop-color="#4d44db"/>
    </linearGradient>
    <linearGradient id="stage3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c5cf6"/>
      <stop offset="1" stop-color="#5a3bd1"/>
    </linearGradient>
    <linearGradient id="foundation" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17233d"/>
      <stop offset="1" stop-color="#263a66"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#273052" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#273052" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="38" fill="url(#background)"/>
  <circle cx="1450" cy="70" r="250" fill="#7967ff" opacity="0.055"/>
  <circle cx="95" cy="740" r="230" fill="#20c997" opacity="0.06"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(90 70)">
      <rect width="58" height="58" rx="17" fill="#111827"/>
      <path d="M17 32 29 15h12L29 43H17l8-11z" fill="#fff"/>
      <path d="M36 15h8l-7 10h-8z" fill="#7c6cff"/>
      <text x="78" y="30" font-size="30" font-weight="800" fill="#111827">EASY VIBE</text>
      <text x="78" y="53" font-size="14" font-weight="700" letter-spacing="2.8" fill="#64748b">LEARNING MAP</text>
    </g>

    <text x="800" y="183" text-anchor="middle" font-size="48" font-weight="850" fill="#111827">From idea to real product</text>
    <text x="800" y="224" text-anchor="middle" font-size="20" font-weight="500" fill="#64748b">Learn AI coding by building, shipping, and growing</text>

    <g opacity="0.7">
      <path d="M507 439h64" fill="none" stroke="#8079c9" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 11"/>
      <path d="m566 428 15 11-15 11" fill="none" stroke="#8079c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1019 439h64" fill="none" stroke="#8079c9" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 11"/>
      <path d="m1078 428 15 11-15 11" fill="none" stroke="#8079c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Stage 1 -->
    <g transform="translate(90 282)" filter="url(#shadow)">
      <rect width="418" height="386" rx="28" fill="#fff"/>
      <rect width="418" height="112" rx="28" fill="url(#stage1)"/>
      <path d="M0 84h418v28H0z" fill="url(#stage1)"/>
      <circle cx="63" cy="56" r="29" fill="#fff" opacity="0.18"/>
      <path d="M50 60c10-19 28-17 28-2 0 10-9 14-16 14H50V60zm7-4v9h6c4 0 8-2 8-7 0-7-9-7-14-2z" fill="#fff"/>
      <text x="108" y="47" font-size="15" font-weight="800" letter-spacing="2" fill="#d7fff2">STAGE 1</text>
      <text x="108" y="79" font-size="27" font-weight="800" fill="#fff">Beginner · Make it real</text>
      <g font-size="20" font-weight="650" fill="#263248">
        <circle cx="48" cy="159" r="13" fill="#dff8ef"/><path d="m42 159 4 4 8-9" fill="none" stroke="#109678" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="75" y="166">Discover &amp; validate ideas</text>
        <circle cx="48" cy="216" r="13" fill="#dff8ef"/><path d="m42 216 4 4 8-9" fill="none" stroke="#109678" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="75" y="223">Prototype with AI tools</text>
        <circle cx="48" cy="273" r="13" fill="#dff8ef"/><path d="m42 273 4 4 8-9" fill="none" stroke="#109678" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="75" y="280">Integrate AI capabilities</text>
        <circle cx="48" cy="330" r="13" fill="#dff8ef"/><path d="m42 330 4 4 8-9" fill="none" stroke="#109678" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="75" y="337">Ship a complete project</text>
      </g>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(591 282)" filter="url(#shadow)">
      <rect width="418" height="386" rx="28" fill="#fff"/>
      <rect width="418" height="112" rx="28" fill="url(#stage2)"/>
      <path d="M0 84h418v28H0z" fill="url(#stage2)"/>
      <circle cx="63" cy="56" r="29" fill="#fff" opacity="0.18"/>
      <path d="M46 44h34v24H46zM52 50v12h22V50H52zm5 23h12v4H57z" fill="#fff"/>
      <text x="108" y="47" font-size="15" font-weight="800" letter-spacing="2" fill="#e9e7ff">STAGE 2</text>
      <text x="108" y="79" font-size="27" font-weight="800" fill="#fff">Builder · Ship products</text>
      <g font-size="20" font-weight="650" fill="#263248">
        <circle cx="48" cy="159" r="13" fill="#eeecff"/><path d="m42 159 4 4 8-9" fill="none" stroke="#6257ed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="75" y="166">UI design &amp; design-to-code</text>
        <circle cx="48" cy="216" r="13" fill="#eeecff"/><path d="m42 216 4 4 8-9" fill="none" stroke="#6257ed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="75" y="223">Frontend + backend</text>
        <circle cx="48" cy="273" r="13" fill="#eeecff"/><path d="m42 273 4 4 8-9" fill="none" stroke="#6257ed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="75" y="280">Database, deploy &amp; billing</text>
        <circle cx="48" cy="330" r="13" fill="#eeecff"/><path d="m42 330 4 4 8-9" fill="none" stroke="#6257ed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="75" y="337">Build full-stack products</text>
      </g>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(1092 282)" filter="url(#shadow)">
      <rect width="418" height="386" rx="28" fill="#fff"/>
      <rect width="418" height="112" rx="28" fill="url(#stage3)"/>
      <path d="M0 84h418v28H0z" fill="url(#stage3)"/>
      <circle cx="63" cy="56" r="29" fill="#fff" opacity="0.18"/>
      <path d="M47 45h32v23H47zM53 51h20v11H53zM42 72h42v5H42z" fill="#fff"/>
      <text x="108" y="47" font-size="15" font-weight="800" letter-spacing="2" fill="#eee7ff">STAGE 3</text>
      <text x="108" y="79" font-size="27" font-weight="800" fill="#fff">Advanced · Scale up</text>
      <g font-size="20" font-weight="650" fill="#263248">
        <circle cx="48" cy="159" r="13" fill="#f0eaff"/><path d="m42 159 4 4 8-9" fill="none" stroke="#744ce6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="75" y="166">Claude Code · MCP · Skills</text>
        <circle cx="48" cy="216" r="13" fill="#f0eaff"/><path d="m42 216 4 4 8-9" fill="none" stroke="#744ce6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="75" y="223">Agent teams &amp; Spec Coding</text>
        <circle cx="48" cy="273" r="13" fill="#f0eaff"/><path d="m42 273 4 4 8-9" fill="none" stroke="#744ce6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="75" y="280">Cross-platform apps</text>
        <circle cx="48" cy="330" r="13" fill="#f0eaff"/><path d="m42 330 4 4 8-9" fill="none" stroke="#744ce6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="75" y="337">Production AI workflows</text>
      </g>
    </g>

    <!-- Foundation -->
    <g transform="translate(90 720)" filter="url(#softShadow)">
      <rect width="1420" height="106" rx="25" fill="url(#foundation)"/>
      <circle cx="55" cy="53" r="25" fill="#fff" opacity="0.12"/>
      <path d="M43 44h24v20H43zM47 48h16v12H47z" fill="#fff"/>
      <text x="98" y="45" font-size="17" font-weight="800" letter-spacing="1.5" fill="#9bb2dc">APPENDIX KNOWLEDGE BASE</text>
      <text x="98" y="73" font-size="21" font-weight="650" fill="#fff">Use it whenever you need the fundamentals</text>
      <g transform="translate(742 53)" font-size="17" font-weight="700" fill="#e7efff">
        <text x="0" y="6">Computer</text><circle cx="103" cy="0" r="3" fill="#8095bd"/>
        <text x="124" y="6">Frontend</text><circle cx="222" cy="0" r="3" fill="#8095bd"/>
        <text x="243" y="6">Backend</text><circle cx="338" cy="0" r="3" fill="#8095bd"/>
        <text x="359" y="6">Infrastructure</text><circle cx="489" cy="0" r="3" fill="#8095bd"/>
        <text x="510" y="6">AI</text><circle cx="550" cy="0" r="3" fill="#8095bd"/>
        <text x="571" y="6">Engineering</text>
      </g>
    </g>
  </g>
</svg>
